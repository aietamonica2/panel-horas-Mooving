name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - refactor/senda-migration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build frontend
        run: npm run build --prefix apps/web
      
      - name: Deploy backend to Cloudflare Workers
        run: npm run deploy --prefix apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Deploy frontend to Cloudflare Pages
        run: |
          cd apps/web
          npx wrangler pages deploy dist --project-name senda --branch main
          cd ../..
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Verify deployment
        run: |
          echo "✅ Deployment Complete!"
          echo "Frontend: https://panel-horas-mooving.pages.dev"
          echo "API Health: Check /api/health endpoint"
