name: Deploy to Cloudflare

# Se dispara manualmente (yo lo lanzo con `gh workflow run deploy.yml`) o por push a main.
# Requiere estos GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  (token con permisos Workers Scripts:Edit, D1:Edit, Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID (3a24c3aa1d8f806d2e716dbdfa88811f)
#   JWT_SECRET            (secreto de firma de JWT del worker)
#   SENDA_MCP_API_KEY     (API key que Senda envía al MCP)
on:
  workflow_dispatch:
  # push:            # Descomentar para deployar automáticamente en cada push a main
  #   branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build --prefix apps/web

      - name: Apply D1 migrations (produccion)
        run: npx wrangler d1 migrations apply panel-mooving-v1 --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set worker secrets (idempotente)
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
          echo "${{ secrets.SENDA_MCP_API_KEY }}" | npx wrangler secret put SENDA_MCP_API_KEY
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy backend (Cloudflare Workers)
        run: npm run deploy --prefix apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy frontend (Cloudflare Pages)
        run: npx wrangler pages deploy dist --project-name panel-horas-mooving --branch main
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment (health debe decir environment=production)
        run: |
          echo "Esperando propagacion..."
          sleep 8
          echo "Health:"
          curl -s https://panel-horas-api.aietamonica.workers.dev/api/health || true
          echo ""
          echo "Records sin token (debe ser 401):"
          curl -s -o /dev/null -w "%{http_code}" https://panel-horas-api.aietamonica.workers.dev/api/data/records || true
          echo ""
          echo "Frontend: https://panel-horas-mooving.pages.dev"
