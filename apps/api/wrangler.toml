name = "panel-horas-api"
main = "src/index.ts"
compatibility_date = "2024-01-22"

[[d1_databases]]
binding = "DB"
database_name = "panel-mooving-v1"
database_id = "4f55653f-0f00-4c7d-bf84-3be78e096bfa"

[vars]
ENVIRONMENT = "development"
SENDA_BASE_URL = "https://sendaqa.telar.ai/api"

# Scheduled triggers
# Cron 1: Bulk load — every Tuesday at 08:00 UTC
# Cron 2: Email reminders — 28th of each month at 12:00 UTC (09:00 ARG)
[triggers]
crons = ["0 8 * * 2", "0 12 28 * *"]

