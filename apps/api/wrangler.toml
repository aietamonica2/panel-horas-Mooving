name = "panel-horas-api"
main = "src/index.ts"
compatibility_date = "2024-01-22"

[[d1_databases]]
binding = "DB"
database_name = "panel-mooving-v1"
database_id = "4f55653f-0f00-4c7d-bf84-3be78e096bfa"

# The DEPLOYED worker must run as production so the auth middleware never grants
# admin without a token (SEC-02). For local development, override with
# ENVIRONMENT=development in apps/api/.dev.vars (git-ignored), which `wrangler dev`
# loads automatically — do NOT set development here.
[vars]
ENVIRONMENT = "production"
SENDA_BASE_URL = "https://sendaqa.telar.ai/api"
# INACTIVITY_DAYS: threshold (in days) for the inactivity-alerts cron below. An
# employee with no logged hours in the last N days gets an alert. The handler
# falls back to 3 if this is unset; set it here to override.
INACTIVITY_DAYS = "3"

# Scheduled triggers — keep in sync with the `scheduled` dispatcher in src/index.ts.
# Cron 1 ("0 8 * * 2"):    Bulk load — every Tuesday at 08:00 UTC.
# Cron 2 ("0 12 28 * *"):  Email reminders — 28th of each month at 12:00 UTC (09:00 ARG).
# Cron 3 ("0 9 * * 1-5"):  Inactivity alerts — weekdays (Mon–Fri) at 09:00 UTC. Auto-sends
#                          alerts to employees with no hours in the last INACTIVITY_DAYS
#                          days (default 3, configurable via the INACTIVITY_DAYS var).
[triggers]
crons = ["0 8 * * 2", "0 12 28 * *", "0 9 * * 1-5"]
